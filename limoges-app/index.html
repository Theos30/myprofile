<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <meta name="description" content="Découvrir, s'informer, partager : tout Limoges dans une seule application.">
  <meta name="theme-color" content="#244E9B">
  <link rel="icon" href="icon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <div class="shell">
    <div class="backdrop" aria-hidden="true"></div>

    <header class="topbar">
      <a href="#mapage" class="brand" aria-label="Ma page">
        <svg class="brand-logo"><use href="#logo"/></svg>
        <span class="brand-text">
          <strong>LIMOGES</strong>
          <small><em>Arts du feu</em> et innovation</small>
        </span>
      </a>
      <button class="icon-btn" id="theme-toggle" aria-label="Changer d'ambiance">
        <svg class="i ico-sun"><use href="#i-sun"/></svg><svg class="i ico-moon"><use href="#i-moon"/></svg>
      </button>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Navigation principale">
      <a href="#mapage" data-tab="mapage"><svg class="i"><use href="#i-grid"/></svg><span>Ma page</span></a>
      <a href="#partager" data-tab="partager"><svg class="i"><use href="#i-megaphone"/></svg><span>Partager</span></a>
      <a href="#agenda" data-tab="agenda"><svg class="i"><use href="#i-calendar"/></svg><span>Agenda</span></a>
      <a href="#jouer" data-tab="jouer"><svg class="i"><use href="#i-quiz"/></svg><span>Jouer</span></a>
      <a href="#guide" data-tab="guide"><svg class="i"><use href="#i-chat"/></svg><span>Guide</span></a>
    </nav>

    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
    <section class="sheet" id="sheet" aria-modal="true" role="dialog" hidden></section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
