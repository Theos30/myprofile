<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CinéDeck</title>
<meta name="description" content="Maquette interactive d'un jeu de cartes à collectionner autour du cinéma.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!--APP-->
<header class="topbar">
  <a class="logo" href="#packs" aria-label="CinéDeck, accueil">
    <span class="logo-mark"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="6.5" r="2"/><circle cx="12" cy="17.5" r="2"/><circle cx="6.5" cy="12" r="2"/><circle cx="17.5" cy="12" r="2"/></svg></span>
    <span class="logo-text">Ciné<em>Deck</em></span>
  </a>
  <span class="coins" id="coins" title="Bobines (monnaie fictive)"></span>
  <button class="btn btn-sm" id="demo-open" type="button" aria-haspopup="dialog">Mode démo</button>
</header>

<nav class="nav" id="nav" aria-label="Navigation principale"></nav>

<main class="view" id="view"></main>

<div class="playerbar" id="playerbar" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Détail de la carte" hidden></div>
<div class="stage" id="stage" role="dialog" aria-modal="true" aria-label="Ouverture de pack" hidden></div>
<aside class="demo" id="demo" role="dialog" aria-label="Mode démo" hidden></aside>
<div class="toasts" id="toasts" aria-live="polite"></div>
<!--/APP-->
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
