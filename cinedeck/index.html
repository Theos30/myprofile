<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CinéDeck</title>
<meta name="description" content="Maquette interactive d'un jeu de cartes à collectionner autour du cinéma.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wdth,wght@75..100,400..700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!--APP-->
<div class="fx" aria-hidden="true"><div class="fx-beam"></div><canvas id="dust"></canvas><div class="fx-vignette"></div></div>

<header class="topbar">
  <a class="marquee" href="#packs" aria-label="CinéDeck, boutique"><span class="marquee-bulbs"></span><span class="marquee-text">CinéDeck</span></a>
  <div class="hud" id="hud"></div>
</header>

<main class="view" id="view"></main>

<div class="capsule" id="capsule" hidden></div>
<nav class="dock" id="dock" aria-label="Navigation principale"></nav>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Détail de la carte" hidden></div>
<div class="stage" id="stage" role="dialog" aria-modal="true" aria-label="Ouverture de pack" hidden></div>
<aside class="demo" id="demo" role="dialog" aria-label="Mode démo" hidden></aside>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="grain" aria-hidden="true"></div>
<!--/APP-->
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
