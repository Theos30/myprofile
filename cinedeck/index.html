<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CinéDeck</title>
<meta name="description" content="Maquette interactive d'un jeu de cartes à collectionner autour du cinéma.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!--APP-->
<header class="topbar">
  <a class="wordmark" href="#packs" aria-label="CinéDeck, accueil">CinéDeck</a>
  <span class="purse" id="purse"></span>
</header>

<main class="view" id="view"></main>

<div class="capsule" id="capsule" hidden></div>
<nav class="navbar" id="navbar" aria-label="Navigation"></nav>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Détail de la carte" hidden></div>
<div class="drawer-wrap" id="drawer" hidden></div>
<div class="stage" id="stage" role="dialog" aria-modal="true" aria-label="Ouverture d'une bobine" hidden></div>
<aside class="demo" id="demo" role="dialog" aria-label="Mode démo" hidden></aside>
<div class="splash" id="splash" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="grain" aria-hidden="true"></div>
<!--/APP-->
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
