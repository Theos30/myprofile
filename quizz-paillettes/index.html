<title>Quizz Paillettes</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@500;700;800;900&family=Noto+Color+Emoji&display=swap">
<style>
/* Layout: one-column phone app on a velvet TV-show stage. Hub tabs (quizz / classement / profil) + a full-screen game flow. */
:root{
  --stage:#150A29; --stage-2:#1F0F3C; --panel:#2A1650; --panel-2:#371E66;
  --line:rgba(255,236,200,.13);
  --ink:#FFF4E0; --muted:#C2B2E0; --dim:#8F7DB3;
  --gold:#FFC93C; --hot:#FF3D81; --good:#2EE6A0; --bad:#FF5148; --cyan:#3FD0FF; --fire:#FF6A1A;
  --on-bright:#160A2B;
  --f-display:"Bungee","Arial Black",Impact,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-emoji:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--stage)}
body{height:100%;margin:0;overflow:hidden;color:var(--ink);font:600 15px/1.4 var(--f-body);
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(255,61,129,.28), transparent 60%),
    radial-gradient(90% 50% at 100% 100%, rgba(63,208,255,.14), transparent 60%),
    var(--stage);
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.eyebrow{font:800 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.hub{overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 104px;gap:18px}
.hub>*,#scr-result>*,#scr-game>*,.g-stage>*{flex-shrink:0}
#scr-game>.g-stage{flex-shrink:1}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;line-height:.9;transform:rotate(-3deg);transform-origin:left center}
.brand-1{font:20px var(--f-display);color:var(--ink)}
.brand-2{font:24px var(--f-display);color:var(--gold);text-shadow:0 0 18px rgba(255,201,60,.55),2px 2px 0 var(--hot)}
.chips{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-weight:800}
.chip b{font:15px var(--f-display)}
.chip .flame{width:16px;height:22px}

/* ---------- presenter ---------- */
.host-svg{display:block;width:100%;height:auto;overflow:visible}
.host-svg .mouth{transform-box:fill-box;transform-origin:center;transform:scaleY(.45)}
.host-svg .brows{transform-box:fill-box;transform-origin:center}
.talking .host-svg .mouth{animation:talk .16s ease-in-out infinite alternate}
.talking .host-svg .brows{animation:brow .5s ease-in-out infinite alternate}
.talking .host-svg{animation:bob .45s ease-in-out infinite alternate}
.host-svg .sequins circle{animation:twinkle 1.6s ease-in-out infinite}
.host-svg .sequins circle:nth-child(3n){animation-delay:.5s}
.host-svg .sequins circle:nth-child(3n+1){animation-delay:1s}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1.15)}}
@keyframes brow{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes bob{from{transform:rotate(-2deg) translateY(0)}to{transform:rotate(2deg) translateY(-2px)}}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}

.bubble{position:relative;background:var(--ink);color:var(--on-bright);border-radius:18px;padding:12px 14px;font:800 14.5px/1.35 var(--f-body);min-height:48px;min-width:0}
.bubble::before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}
.bubble .who{display:block;font:11px var(--f-display);color:var(--hot);letter-spacing:.04em;margin-bottom:3px}

.stage-card{position:relative;display:grid;grid-template-columns:104px 1fr;align-items:center;gap:14px;padding:22px 16px 18px;border-radius:24px;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);overflow:hidden}
.stage-card::after{content:"";position:absolute;inset:auto -20% -60% -20%;height:120%;background:radial-gradient(closest-side,rgba(255,201,60,.18),transparent);pointer-events:none}
.bulbs{position:absolute;top:8px;left:14px;right:14px;display:flex;justify-content:space-between}
.bulbs i{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:bulb 1.2s steps(1) infinite}
.bulbs i:nth-child(even){animation-delay:.6s}
@keyframes bulb{0%{opacity:1}50%{opacity:.25}}
.host-wrap{position:relative;z-index:1}

/* ---------- daily strip ---------- */
.daily{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:end}
.daily .date{display:block;font:20px var(--f-display);margin-top:6px;text-transform:capitalize}
.renew{text-align:right;font-size:12px;color:var(--muted)}
.renew b{display:block;font:18px var(--f-display);color:var(--gold);font-variant-numeric:tabular-nums}
.dprog{grid-column:1/-1;height:8px;border-radius:99px;background:var(--panel);overflow:hidden}
.dprog i{display:block;height:100%;background:linear-gradient(90deg,var(--hot),var(--gold));border-radius:inherit}
.daily small{grid-column:1/-1;color:var(--muted);margin-top:-4px}

.sec-title{display:flex;align-items:baseline;justify-content:space-between;font:18px var(--f-display);letter-spacing:.01em}
.sec-title small{font:700 12px var(--f-body);color:var(--muted)}

/* ---------- theme library ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:158px;padding:14px;border-radius:22px;text-align:left;overflow:hidden;
  background:var(--c);color:var(--on-bright);box-shadow:0 6px 0 rgba(0,0,0,.28),inset 0 -40px 60px rgba(0,0,0,.12);transition:transform .15s}
.tcard:active{transform:translateY(3px) scale(.98)}
.t-bgicon{position:absolute;right:-22px;bottom:-26px;width:110px;height:110px;opacity:.17;transform:rotate(-14deg)}
.t-bgicon svg{width:100%;height:100%}
.t-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:rgba(22,10,43,.9);color:var(--c);margin-bottom:8px}
.t-icon svg{width:26px;height:26px}
.t-name{font:16px/1.05 var(--f-display)}
.t-sub{font:800 12px var(--f-body);opacity:.75}
.t-status{margin-top:auto;padding:4px 9px;border-radius:99px;background:rgba(22,10,43,.88);color:var(--gold);font:900 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase}
.t-status.done{color:var(--good)}
.t-status.lost{color:#FFB4AE}
.t-feat{position:absolute;top:12px;right:12px;padding:4px 8px;border-radius:8px;background:var(--on-bright);color:var(--gold);font:11px var(--f-display);transform:rotate(6deg);box-shadow:0 0 0 2px var(--gold)}

/* ---------- tab bar ---------- */
.tabbar{position:absolute;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;border-radius:22px;
  background:rgba(31,15,60,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:16px;color:var(--dim);font:800 11.5px var(--f-body)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{background:var(--panel-2);color:var(--gold)}

/* ---------- page headers ---------- */
.pg-head h1{font:26px var(--f-display)}
.pg-head p{color:var(--muted);margin-top:4px}
.pg-head p b{color:var(--gold);font-variant-numeric:tabular-nums}

/* ---------- leaderboard ---------- */
.seg{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;height:34px;padding:0 14px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font:800 13px var(--f-body);color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--c,var(--gold));color:var(--on-bright);border-color:transparent}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin-top:6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod .nm{font:800 12.5px var(--f-body);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .block{width:100%;border-radius:16px 16px 6px 6px;display:grid;place-items:center;padding:10px 4px;font:15px var(--f-display)}
.pod .block small{display:block;font:800 11px var(--f-body);opacity:.8}
.pod.p1 .block{height:104px;background:var(--gold);color:var(--on-bright)}
.pod.p2 .block{height:80px;background:#D9D2EA;color:var(--on-bright)}
.pod.p3 .block{height:64px;background:#E0915A;color:var(--on-bright)}
.pod.you .nm{color:var(--gold)}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:30px 36px 1fr auto;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--panel)}
.row .rk{font:14px var(--f-display);color:var(--dim);text-align:center}
.row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.row .nm small{display:block;color:var(--dim);font-weight:700;font-size:11.5px}
.row .sc{font:15px var(--f-display);font-variant-numeric:tabular-nums}
.row.you{background:linear-gradient(90deg,rgba(255,201,60,.22),var(--panel));box-shadow:inset 0 0 0 2px var(--gold)}
.row.you .rk{color:var(--gold)}
.empty-you{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:16px;border:2px dashed var(--line)}

.av{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--c,var(--gold));color:var(--on-bright);font:13px var(--f-display);box-shadow:0 0 0 2px var(--stage)}
.av.lg{width:64px;height:64px;font-size:22px}
.av.xl{width:88px;height:88px;font-size:30px}

/* ---------- profile ---------- */
.prof{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:18px;border-radius:24px;background:linear-gradient(160deg,var(--panel-2),var(--panel));border:1px solid var(--line)}
.ring{--p:0;padding:6px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.1) 0)}
.prof .ttl{font:16px var(--f-display);color:var(--gold)}
.prof label{display:block;font:800 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.prof input{width:100%;margin-top:4px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--stage-2);color:var(--ink);padding:0 12px;font:800 16px var(--f-body)}
.xpbar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:10px}
.xpbar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--hot),var(--gold));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.xpline{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px 10px;border-radius:16px;background:var(--panel);min-width:0}
.stat b{display:block;font:20px var(--f-display);font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-weight:800;font-size:11.5px}
.mastery{display:flex;flex-direction:column;gap:10px}
.m-row{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;font-weight:800;font-size:13px}
.m-row .bar{height:10px;border-radius:99px;background:var(--panel);overflow:hidden}
.m-row .bar i{display:block;height:100%;background:var(--c);border-radius:inherit}
.m-row span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.rules{display:flex;flex-direction:column;gap:10px}
.rule{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:start;padding:12px;border-radius:16px;background:var(--panel)}
.rule .rn{display:grid;place-items:center;height:48px;border-radius:12px;background:var(--rc);color:var(--on-bright);font:13px var(--f-display);text-align:center;line-height:1}
.rule h3{font:14px var(--f-display)}
.rule p{color:var(--muted);font-size:13.5px;margin-top:3px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:16px;background:var(--panel);font-weight:800}
.switch{width:52px;height:30px;border-radius:99px;background:var(--dim);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--ink);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}

/* ---------- buttons ---------- */
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 24px;border-radius:18px;background:var(--gold);color:var(--on-bright);
  font:17px var(--f-display);letter-spacing:.02em;box-shadow:0 5px 0 #B9871A;transition:transform .1s,box-shadow .1s}
.btn-primary:active{transform:translateY(4px);box-shadow:0 1px 0 #B9871A}
.btn-ghost{height:48px;padding:0 18px;border-radius:16px;border:2px solid var(--line);font:800 15px var(--f-body);color:var(--ink)}
.btn-sm{height:38px;padding:0 14px;border-radius:12px;background:var(--gold);color:var(--on-bright);font:13px var(--f-display)}

/* ============ GAME ============ */
#scr-game{padding:10px 16px 16px;gap:10px;transition:background .4s}
#scr-game.express{background:
  repeating-linear-gradient(-45deg,rgba(255,106,26,.10) 0 18px,transparent 18px 36px),
  radial-gradient(100% 70% at 50% 0%,rgba(255,106,26,.35),transparent 70%),var(--stage)}
#scr-game.hardcore{background:radial-gradient(100% 70% at 50% 0%,rgba(255,61,129,.30),transparent 70%),#0D0619}
#scr-game.pre .g-top,#scr-game.pre .pips,#scr-game.pre .g-host{display:none}
.g-top{display:grid;grid-template-columns:34px 1fr auto 1fr;align-items:center;gap:8px}
.g-quit{width:34px;height:34px;border-radius:50%;background:var(--panel);display:grid;place-items:center;color:var(--muted)}
.g-quit svg{width:16px;height:16px}
.pl{display:flex;align-items:center;gap:8px;min-width:0}
.pl.them{justify-content:flex-end;text-align:right}
.pl-t{min-width:0}
.pl-t small{display:block;font:800 11px var(--f-body);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-t b{display:block;font:22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.pl.me b{color:var(--gold)}
.g-q{text-align:center;line-height:1}
.g-q b{font:18px var(--f-display)}
.g-q small{color:var(--muted);font-weight:800}
.g-mode{display:block;margin-top:4px;padding:3px 8px;border-radius:99px;background:var(--panel);font:900 9.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.pips{display:grid;grid-template-columns:repeat(25,1fr);gap:3px}
.pips i{height:6px;border-radius:3px;background:rgba(255,255,255,.12)}
.pips i.m-ttmc{background:rgba(255,201,60,.25)}
.pips i.m-express{background:rgba(255,106,26,.25)}
.pips i.m-final{background:rgba(255,61,129,.3)}
.pips i.cur{background:var(--ink);box-shadow:0 0 8px var(--ink)}
.pips i.ok{background:var(--good)}
.pips i.ko{background:var(--bad)}
.g-host{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center}
.g-host .bubble{font-size:13.5px;padding:9px 12px;min-height:40px}
.g-host .bubble::before{top:12px}
.g-stage{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:4px}

.qcard{position:relative;padding:18px 16px;border-radius:22px;background:linear-gradient(170deg,var(--panel-2),var(--panel));border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;animation:cardIn .35s cubic-bezier(.2,.9,.3,1.3)}
.qcard .qtag{align-self:flex-start;padding:4px 10px;border-radius:99px;background:var(--c,var(--gold));color:var(--on-bright);font:11px var(--f-display);letter-spacing:.03em}
.qtext{font:800 21px/1.25 var(--f-body)}
.visual{font:96px/1 var(--f-emoji);text-align:center;padding:4px 0;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
@keyframes cardIn{from{opacity:.2;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}

.timer{display:grid;grid-template-columns:1fr 56px;gap:10px;align-items:center}
.timer .bar{height:12px;border-radius:99px;background:var(--panel);overflow:hidden}
.timer .bar i{display:block;height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,var(--good),var(--gold));border-radius:inherit}
.timer.low .bar i{background:var(--bad)}
.timer .tval{font:18px var(--f-display);text-align:right;font-variant-numeric:tabular-nums;color:var(--gold)}
.timer.low .tval{color:var(--bad);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}

.answers{display:flex;flex-direction:column;gap:9px}
.ans{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border-radius:16px;text-align:left;
  background:var(--panel);border:2px solid var(--line);font:800 16px/1.2 var(--f-body);transition:transform .1s,background .2s,opacity .2s;animation:ansIn .3s backwards}
.ans:nth-child(2){animation-delay:.05s}.ans:nth-child(3){animation-delay:.1s}.ans:nth-child(4){animation-delay:.15s}
@keyframes ansIn{from{opacity:0;transform:translateX(-12px)}}
.ans:active{transform:scale(.98)}
.ans .k{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--stage-2);font:13px var(--f-display);color:var(--muted)}
.ans .lbl{flex:1;min-width:0}
.ans.good{background:var(--good);color:var(--on-bright);border-color:transparent;animation:pop .35s}
.ans.good .k{background:rgba(22,10,43,.85);color:var(--good)}
.ans.bad{background:var(--bad);color:#fff;border-color:transparent;animation:shake .4s}
.ans.dim{opacity:.4}
.botpick{position:absolute;right:10px;top:50%;margin-top:-14px;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--c);color:var(--on-bright);font:10px var(--f-display);box-shadow:0 0 0 2px var(--stage);animation:pop .3s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

.floatpts{position:fixed;z-index:30;font:26px var(--f-display);color:var(--good);text-shadow:0 2px 0 var(--on-bright);pointer-events:none;animation:floatUp 1.1s ease-out forwards}
.floatpts.zero{color:var(--bad)}
@keyframes floatUp{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-46px) scale(1)}}

/* VS intro */
.vs{display:flex;flex-direction:column;gap:16px;padding-top:6px}
.vs-theme{align-self:center;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:var(--c);color:var(--on-bright);font:15px var(--f-display)}
.vs-theme svg{width:20px;height:20px}
.vs-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.vs-p{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.vs-p b{font-weight:900;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs-p small{color:var(--muted);font-weight:800}
.vs-p:first-child{animation:slideL .5s cubic-bezier(.2,.9,.3,1.2)}
.vs-p:last-child{animation:slideR .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slideL{from{transform:translateX(-80px);opacity:0}}
@keyframes slideR{from{transform:translateX(80px);opacity:0}}

/* ---------- réponses tapées : tolérance accents / fautes ---------- */
const STOP = new Set(['le','la','les','l','un','une','des','de','du','d','the','a','au','aux','et','en']);
function norm(s){
  return String(s).toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(w => w && !STOP.has(w)).join('');
}
function lev(a, b){
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length:n+1}, (_, j) => j);
  for (let i = 1; i <= m; i++){ const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
function isMatch(input, item){
  const n = norm(input); if (!n) return false;
  return [item.a, ...item.alts].some(c => {
    const k = norm(c); if (!k) return false; if (k === n) return true;
    const tol = /\d/.test(k) || k.length <= 4 ? 0 : k.length <= 9 ? 1 : 2;
    return lev(k, n) <= tol;
  });
}

const sfx = (() => {
  let ctx = null;
  function unlock(){ try { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); } catch(e){} }
  function tone(f, t0, dur, type = 'sine', vol = .14, slide){
    if (!ctx || !S.sound) return;
    const t = ctx.currentTime + t0, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur + .05);
  }
  return {
    unlock,
    tap(){ tone(520, 0, .06, 'triangle', .07); },
    good(){ tone(660, 0, .12, 'triangle'); tone(990, .09, .2, 'triangle'); },
    bad(){ tone(190, 0, .38, 'sawtooth', .1, 80); },
    tick(){ tone(1250, 0, .04, 'square', .045); },
    count(){ tone(440, 0, .15, 'square', .08); },
    go(){ tone(880, 0, .3, 'square', .09); },
    fanfare(){ [523,659,784,1046].forEach((f,i) => tone(f, i*.11, .26, 'triangle', .13)); },
    siren(){ for (let i = 0; i < 4; i++){ tone(720, i*.3, .15, 'square', .06); tone(980, i*.3 + .15, .15, 'square', .06); } },
    combo(n){ tone(420 + n*70, 0, .1, 'triangle', .11); tone(640 + n*90, .06, .14, 'sine', .09); },
    win(){ [523,659,784,1046,784,1046].forEach((f,i) => tone(f, i*.12, .3, 'triangle', .13)); },
    lose(){ [392,349,311,262].forEach((f,i) => tone(f, i*.2, .32, 'sawtooth', .07)); }
  };
})();

/* =========================================================
   GÉNÉRATION QUOTIDIENNE DES 25 QUESTIONS
   ========================================================= */
function themeItems(id, r){
  if (id === 'drapeaux'){
    return FLAGS.map(([v, a, d, reg, alts]) => {
      let pool = FLAGS.filter(f => f[1] !== a && (d >= 4 ? f[3] === reg : true));
      if (pool.length < 3) pool = FLAGS.filter(f => f[1] !== a);
      return { d, q:'À quel pays appartient ce drapeau ?', a, w: shuffle(pool, r).slice(0,3).map(f => f[1]), v, flag:true, alts: alts ? alts.split('|') : [] };
    });
  }
  return BANK[id].map(([d, q, a, w1, w2, w3, alts]) => ({ d, q, a, w:[w1,w2,w3], alts: alts ? alts.split('|') : [] }));
}
function buildQuiz(themeId, day){
  const r = mulberry(seedOf(day + '#' + themeId));
  const items = shuffle(themeItems(themeId, r), r);
  const take = (pred, n) => { const out = []; for (let i = 0; i < items.length && out.length < n; i++){ if (pred(items[i])){ out.push(items.splice(i,1)[0]); i--; } } return out; };
  let classic = take(it => it.d <= 4, 10); if (classic.length < 10) classic = classic.concat(take(it => it.d <= 6, 10 - classic.length));
  let fin = take(it => it.d >= 6, 1); if (!fin.length) fin = take(() => true, 1);
  let exp = take(it => it.d <= 6, 10); if (exp.length < 10) exp = exp.concat(take(() => true, 10 - exp.length));
  const mc = it => ({ mode:'classic', item:it, opts: shuffle([it.a, ...it.w], r) });
  const ex = it => { const truth = r() < .5; return { mode:'express', item:it, truth, shown: truth ? it.a : pick(it.w, r) }; };
  const steps = [
    ...classic.slice(0,6).map(mc),
    {mode:'ttmc'}, {mode:'ttmc'},
    ...exp.map(ex),
    ...classic.slice(6,10).map(mc),
    {mode:'ttmc'}, {mode:'ttmc'},
    { mode:'final', item: fin[0] }
  ];
  return { steps, pool: items, r };
}
function chooseTTMC(quiz, level){
  const pool = quiz.pool;
  const best = Math.min(...pool.map(it => Math.abs(it.d - level)));
  const it = pick(pool.filter(x => Math.abs(x.d - level) === best), quiz.r);
  pool.splice(pool.indexOf(it), 1);
  return it;
}
function rivalFor(themeId, day){
  const r = mulberry(seedOf('rival' + day + themeId));
  const name = pick(PLAYERS, r);
  const sk = skillOf(name);
  return { name, color: colorOf(name), skill: clamp(sk + .1, .45, .9), lvl: 2 + Math.floor(sk * 28) };
}

/* =========================================================
   CLASSEMENT DU JOUR (joueurs simulés qui jouent au fil de la journée)
   ========================================================= */
function botTheme(name, idx, themeId, day, mins){
  const r = mulberry(seedOf(day + '|' + name + '|' + themeId));
  const plays = r() < .7, at = idx < 6 ? 0 : 30 + Math.floor(Math.pow(r(), .85) * 1380);
  const sk = skillOf(name);
  const sc = Math.round(clamp(90 + sk * 300 + (r() - .5) * 170, 25, 470));
  return plays && at <= mins ? sc : null;
}
function board(sel, day){
  const now = new Date(), mins = now.getHours() * 60 + now.getMinutes();
  const rows = PLAYERS.map((name, i) => {
    if (sel === 'all'){
      let total = 0, n = 0;
      THEMES.forEach(t => { const s = botTheme(name, i, t.id, day, mins); if (s != null){ total += s; n++; } });
      return n ? { name, score: total, sub: `${n} thème${n>1?'s':''}` } : null;
    }
    const s = botTheme(name, i, sel, day, mins);
    return s == null ? null : { name, score: s };
  }).filter(Boolean).map(r => Object.assign(r, { color: colorOf(r.name), lvl: 2 + Math.floor(skillOf(r.name) * 28) }));
  const mine = S.days[day] || {};
  let myScore = null, myN = 0;
  if (sel === 'all'){ for (const k in mine){ myScore = (myScore || 0) + mine[k].score; myN++; } }
  else if (mine[sel]) myScore = mine[sel].score;
  if (myScore != null) rows.push({ name: S.pseudo, score: myScore, you: true, color: 'var(--gold)', lvl: levelInfo(S.xp).lvl, sub: sel === 'all' ? `${myN} thème${myN>1?'s':''}` : '' });
  rows.sort((a, b) => b.score - a.score || (a.you ? -1 : 1));
  return rows;
}

let G = null;

function startTimer(ms, onTick, onEnd){
  const t = { start: performance.now(), acc: 0, paused: false, done: false, raf: 0 };
  const loop = now => {
    if (t.done) return;
    if (!t.paused){ const el = t.acc + (now - t.start); if (el >= ms){ t.done = true; onTick(ms); onEnd(); return; } onTick(el); }
    t.raf = requestAnimationFrame(loop);
  };
  t.elapsed = () => t.paused ? t.acc : t.acc + performance.now() - t.start;
  t.pause = () => { if (!t.paused){ t.acc += performance.now() - t.start; t.paused = true; } };
  t.resume = () => { if (t.paused){ t.start = performance.now(); t.paused = false; } };
  t.stop = () => { t.done = true; cancelAnimationFrame(t.raf); };
  t.raf = requestAnimationFrame(loop);
  return t;
}
function later(fn, ms){ const g = G; setTimeout(() => { if (!g || G !== g) return; if (g.paused){ g.queue.push(fn); return; } fn(); }, ms); }

const visual = it => it.v ? `<div class="visual" aria-label="drapeau">${it.v}</div>` : '';
const timerHTML = (cls = '') => `<div class="timer ${cls}"><div class="bar"><i></i></div><span class="tval num"></span></div>`;
const answersHTML = opts => `<div class="answers">${opts.map((o, i) => `<button class="ans" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span class="lbl">${esc(o)}</span></button>`).join('')}</div>`;

function tweenNum(el, from, to){
  if (!el) return;
  if (reduced || from === to){ el.textContent = to; return; }
  const t0 = performance.now(), d = 600;
  const step = now => { const k = Math.min(1, (now - t0) / d); el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function floatPts(pts, anchor){
  const el = document.createElement('div');
  el.className = 'floatpts' + (pts ? '' : ' zero');
  el.textContent = pts ? '+' + pts : '0';
  const r = (anchor || $('#gMe')).getBoundingClientRect();
  el.style.left = (r.left + r.width / 2 - 20) + 'px'; el.style.top = (r.top - 6) + 'px';
  document.body.appendChild(el); setTimeout(() => el.remove(), 1200);
}
function award(part, pts, botPts, ok){
  const me0 = G.score, bot0 = G.bot;
  G.score += pts; G.bot += botPts; G.parts[part] += pts; G.answered++; if (ok) G.correct++;
  G.trail[G.idx] = ok ? 1 : 0;
  tweenNum($('#gMe'), me0, G.score); tweenNum($('#gBot'), bot0, G.bot);
  floatPts(pts);
  const pip = $$('#gPips i')[G.idx]; if (pip){ pip.classList.remove('cur'); pip.classList.add(ok ? 'ok' : 'ko'); }
  if (ok){ sfx.good(); buzz(30); } else { sfx.bad(); buzz([60,40,60]); }
}
function revealMCQ(opts, answer, chosen, botIdx){
  $$('.ans', stage()).forEach((b, i) => {
    b.disabled = true;
    if (opts[i] === answer) b.classList.add('good');
    else if (i === chosen) b.classList.add('bad');
    else b.classList.add('dim');
    if (i === botIdx) b.insertAdjacentHTML('beforeend', `<span class="botpick" style="--c:${G.rival.color}" title="Réponse de ${esc(G.rival.name)}">${esc(initials(G.rival.name))}</span>`);
  });
}
function botMCQ(opts, answer, p){
  const ci = opts.indexOf(answer);
  if (Math.random() < .05) return { idx: -1, ok: false, time: 10 };
  const ok = Math.random() < p;
  const wrong = opts.map((_, i) => i).filter(i => i !== ci);
  return { idx: ok ? ci : pick(wrong), ok, time: 1.2 + Math.random() * 7.5 };
}
function bindAnswers(fn){ $$('.ans', stage()).forEach(b => b.onclick = () => fn(+b.dataset.i)); }

/* =========================================================
   FIN DE PARTIE
   ========================================================= */
function finish(){
  const g = G; if (!g) return;
  G = null;
  const win = g.score > g.bot ? 1 : g.score < g.bot ? -1 : 0;
  const feat = featuredTheme(g.day) === g.theme.id;
  let xp = g.ranked ? g.score + (win > 0 ? 100 : win === 0 ? 40 : 0) : Math.round(g.score * .2);
  if (feat && g.ranked) xp *= 2;
  const before = levelInfo(S.xp); S.xp += xp; const after = levelInfo(S.xp);
  const st = S.stats;
  st.games++; if (win > 0) st.wins++; st.best = Math.max(st.best, g.score);
  st.correct += g.correct; st.answered += g.answered; st.bestCombo = Math.max(st.bestCombo, g.bestCombo);
  st.finalsTried++; if (g.finalOk) st.finals++;
  S.best[g.theme.id] = Math.max(S.best[g.theme.id] || 0, g.score);
  if (g.ranked){
    (S.days[g.day] = S.days[g.day] || {})[g.theme.id] = { score: g.score, bot: g.bot, win, rival: g.rival.name };
    if (S.lastDay !== g.day){ S.streak = S.lastDay === yesterdayKey() ? S.streak + 1 : 1; S.lastDay = g.day; }
    Object.keys(S.days).sort().slice(0, -14).forEach(k => delete S.days[k]);
  }
  save();

  let rankLine = '';
  if (g.ranked){
    const rows = board(g.theme.id, g.day), pos = rows.findIndex(r => r.you) + 1;
    rankLine = `<div class="res-rank">Classement du jour en ${esc(g.theme.name)}<br><b>${pos}${pos === 1 ? 'er' : 'e'}</b> sur ${rows.length} joueurs</div>`;
  }
  const head = win > 0 ? ['win','Victoire !'] : win < 0 ? ['lose','Défaite'] : ['tie','Égalité'];
  const lv = g.levels.length ? ` · niveaux ${g.levels.join(', ')}` : '';
  const el = $('#scr-result');
  el.innerHTML = `
    <div class="res-head ${head[0]}"><span class="eyebrow">${esc(g.theme.name)} · ${g.ranked ? 'Partie classée' : 'Entraînement'}</span><h1>${head[1]}</h1></div>
    <div class="res-vs">
      <div class="side ${win >= 0 ? 'win' : ''}"><span class="av lg" style="--c:var(--gold)">${esc(initials(S.pseudo))}</span><b>${g.score}</b><small>${esc(S.pseudo)}</small></div>
      <div class="mid">VS</div>
      <div class="side ${win <= 0 ? 'win' : ''}"><span class="av lg" style="--c:${g.rival.color}">${esc(initials(g.rival.name))}</span><b>${g.bot}</b><small>${esc(g.rival.name)}</small></div>
    </div>
    <div class="host-row" data-host><div>${hostSVG()}</div><div class="bubble" id="resBubble"></div></div>
    <ul class="break">
      <li style="--rc:var(--cyan)"><span>Classique<small>${g.classicOk}/10 bonnes réponses</small></span><b>${g.parts.classic}</b></li>
      <li style="--rc:var(--gold)"><span>Tu te mets combien<small>4 paris${lv}</small></span><b>${g.parts.ttmc}</b></li>
      <li style="--rc:var(--fire)"><span>Express time<small>meilleur combo x${g.bestCombo}</small></span><b>${g.parts.express}</b></li>
      <li style="--rc:var(--hot)"><span>Extra hardcore<small>${g.finalOk ? 'réussie' : 'ratée'}</small></span><b>${g.parts.final}</b></li>
      <li class="total" style="--rc:var(--ink)"><span>Total<small>sur ${MAX_SCORE} possibles</small></span><b>${g.score}</b></li>
    </ul>
    <div class="trail" aria-label="Tes 25 réponses">${g.quiz.steps.map((_, i) => `<i class="${g.trail[i] === 1 ? 'ok' : g.trail[i] === 0 ? '' : 'x'}"></i>`).join('')}</div>
    <div class="res-xp">
      <div class="top"><span class="eyebrow">Expérience${feat && g.ranked ? ' · thème vedette ×2' : ''}${g.ranked ? '' : ' · entraînement'}</span><span class="gain">+${xp} XP</span></div>
      <div class="xpbar"><i id="resXp" style="width:${after.lvl > before.lvl ? 0 : before.into / before.need * 100}%"></i></div>
      <div class="xpline"><span>Niveau ${after.lvl} · ${titleOf(after.lvl)}</span><span>${after.into} / ${after.need}</span></div>
      ${after.lvl > before.lvl ? `<span class="lvup">Niveau supérieur ! ${after.lvl}</span>` : ''}
    </div>
    ${rankLine}
    <div class="res-actions">
      <button class="btn-primary" id="resHome">Retour aux quizz</button>
      <div class="row2"><button class="btn-ghost" id="resShare">Copier mon score</button><button class="btn-ghost" id="resReplay">Rejouer</button></div>
    </div>`;
  show('scr-result'); el.scrollTop = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => { const b = $('#resXp'); if (b) b.style.width = (after.into / after.need * 100) + '%'; }));
  say(line(win > 0 ? 'win' : win < 0 ? 'lose' : 'tie', { rival: g.rival.name }), $('#resBubble'));
  if (win > 0){ sfx.win(); confetti(180); } else if (win < 0) sfx.lose(); else sfx.fanfare();
  $('#resHome').onclick = () => goTab('home');
  $('#resReplay').onclick = () => startQuiz(g.theme.id);
  $('#resShare').onclick = e => {
    const marks = g.quiz.steps.map((s, i) => g.trail[i] === 1 ? (s.mode === 'express' ? '⚡' : s.mode === 'final' ? '💎' : '🟩') : (s.mode === 'final' ? '💀' : '🟥')).join('');
    const d = new Date().toLocaleDateString('fr-FR');
    const txt = `Quizz Paillettes · ${g.theme.name} · ${d}\n${marks}\n${g.score} pts · ${head[1]} contre ${g.rival.name} · combo x${g.bestCombo}`;
    const btn = e.currentTarget;
    const done = () => { btn.textContent = 'Copié !'; setTimeout(() => btn.textContent = 'Copier mon score', 1800); };
    try { navigator.clipboard.writeText(txt).then(done, () => toast(txt)); } catch(err){ toast(txt); }
  };
}
function toast(text){
  const t = document.createElement('div'); t.className = 'toast'; t.style.whiteSpace = 'pre-line'; t.style.userSelect = 'all'; t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), 5000);
}

/* =========================================================
   CONFETTIS
   ========================================================= */
function confetti(n){
  if (reduced) return;
  const c = $('#confetti'), ctx = c.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cols = ['#FFC93C','#FF3D81','#3FD0FF','#2EE6A0','#FFF4E0','#FF6A1A'];
  const ps = Array.from({length:n}, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4,
    s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: pick(cols) }));
  const t0 = performance.now();
  (function frame(now){
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); ctx.restore(); });
    if (now - t0 < 3200) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

/* =========================================================
   HORLOGE : compte à rebours + changement de jour
   ========================================================= */
let shownDay = dayKey();
setInterval(() => {
  $$('[data-cd]').forEach(el => el.textContent = hms(msToMidnight()));
  const d = dayKey();
  if (d !== shownDay){ shownDay = d; if (!G && !$('#scr-' + currentTab).hidden) goTab(currentTab); }
}, 1000);

goTab('home');
})();
</script>
